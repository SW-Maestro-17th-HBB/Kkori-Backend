# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #

# AI가 응답할 때 사용할 기본 언어를 설정합니다. (예: ko-KR, en-US)
language: ko-KR
# AI의 페르소나와 응답 톤앤매너를 상세하게 지시합니다. 최대 200자까지 작성할 수 있습니다.
tone_instructions: |
  당신은 소프트웨어 마에스트로 멘토입니다. 목표는 소프트웨어 마에스트로 멘티가 코드 품질을 개선하며 성장하도록 돕는 것입니다.
  - 변경 도메인의 PRD와 연결 이슈를 먼저 확인하세요.
  - 요구사항과 인수 조건이 구현·테스트에 반영됐는지 검증하세요.
  - 예외, 권한, 보안, 데이터 정합성 누락을 우선 지적하세요.
  - 문제의 영향과 구체적인 개선안을 제시하세요.
  - 스타일보다 기능 정확성과 안정성을 우선하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill
  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  request_changes_workflow: false
  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true
  # 변경된 각 파일에 대한 요약을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  changed_files_summary: false
  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false
  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부입니다.
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  poem: true
  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다.
  path_instructions:
    # Spring 애플리케이션 공통 리뷰 기준
    - path: "src/main/java/**"
      instructions: |
        - 변경된 도메인의 docs/requirements/<도메인>/ PRD의 검증 기준·정책과 구현이 일치하는지 확인하고, 어긋나는 지점을 지적하세요.
        - PR 본문의 완료 조건이 코드와 테스트로 실제 충족되는지 확인하세요.
        - 실제 버그, 보안 문제, 데이터 정합성 문제를 우선 검토하세요.
        - Controller, Service, Repository 계층의 책임이 적절히 분리되었는지 확인하세요.
        - 트랜잭션 경계와 예외 처리 방식이 적절한지 확인하세요.
        - 입력값 검증이 누락되지 않았는지 확인하세요.
        - 인증된 사용자와 리소스 소유권 검증이 누락되지 않았는지 확인하세요.
        - JPA N+1, 불필요한 조회, 지연 로딩 및 영속성 컨텍스트 문제를 확인하세요.
        - null 처리와 Optional 사용이 적절한지 확인하세요.
        - 로그에 토큰, 개인정보, 인증정보가 노출되지 않는지 확인하세요.
        - 미작성한 테스트 코드 케이스가 있다면, 어떤 테스트가 필요한지 제안해주세요. (예: API 테스트, Service 단위 테스트, Repository 단위 테스트)

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # PR이 생성됐을 때
    # false로 설정 시 `@coderabbitai review`를 코멘트에 입력하면 리뷰를 시작합니다.
    enabled: true
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서만 자동으로 리뷰를 진행할지 여부입니다.
    auto_incremental_review: true

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true
  # 레포지토리 내의 특정 파일을 AI의 코드 스타일 가이드라인으로 사용하도록 설정합니다.
  # PRD(검증 기준·정책)를 리뷰 컨텍스트로 학습시키기 위해 사용. CLAUDE.md는 기본 패턴이라 자동 포함.
  code_guidelines:
    enabled: true
    filePatterns:
      - docs/requirements/*.md
      - docs/requirements/**/*.md
  # CodeRabbit이 대화나 리뷰를 통해 학습한 내용을 어디에 저장하고 참조할지 범위를 설정합니다. 'local'은 현재 레포지토리에 한정됨을 의미합니다.
  learnings:
    scope: local
  # 이슈 정보를 참조할 범위를 설정합니다.
  issues:
    scope: local
  # 풀 리퀘스트 정보를 참조할 범위를 설정합니다.
  pull_requests:
    scope: local