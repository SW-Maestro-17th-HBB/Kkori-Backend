name: CI

on:
  push:
    branches: [develop] # main은 Deploy 워크플로가 workflow_call로 호출 (중복 실행 방지)
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build
