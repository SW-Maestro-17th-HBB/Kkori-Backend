# CD — main 브랜치 push(= develop→main 머지) 시, CI를 재사용 워크플로로 직접 돌려
# 통과한 경우에만 프로드 배포한다 (needs: ci).
# workflow_run 방식은 기본 브랜치 컨텍스트로 실행돼 OIDC sub가 develop이 되면서
# main 전용 IAM 신뢰 조건과 충돌했다 — push 트리거 + workflow_call 호출로 sub를 main으로 유지한다.
# 인증은 GitHub OIDC → kkori-cd 롤 (액세스 키 없음, Kkori-Infra envs/prod/cicd.tf 참조).
# DB 스키마: 앱이 기동 시 Flyway 마이그레이션(src/main/resources/db/migration)을 적용한 뒤 ddl-auto validate로
#            엔티티와 대조한다(HBB1-330). 마이그레이션 실패 = 새 태스크 기동 실패 = 배포 실패(이전 태스크 유지).
#            타 레포 소유 테이블(Kkori-AI 에이전트·Worker)은 여전히 각 레포가 배포 전에 선적용한다.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  IMAGE: 172630972882.dkr.ecr.ap-northeast-2.amazonaws.com/kkori/backend:prod

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # 액션은 커밋 SHA로 고정 — 이 워크플로는 AWS 자격증명을 쥐므로 태그 탈취 시 피해가 큼.
    # 갱신은 Dependabot(.github/dependabot.yml)이 SHA와 버전 주석을 함께 올린다.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # 이후 단계에서 인증된 git 명령을 쓰지 않음

      # ECS 노드가 Graviton(arm64)이라 크로스 빌드 — GHA 레이어 캐시로 2회차부터 단축
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::172630972882:role/kkori-cd
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ECS 재배포 및 안정화 대기
        run: |
          aws ecs update-service --cluster kkori-prod --service kkori-prod-spring --force-new-deployment
          aws ecs wait services-stable --cluster kkori-prod --services kkori-prod-spring
