services:
  postgres:
    # pgvector 동봉 이미지 — 임베딩 벡터 스키마(resume_chunks.embedding vector, PRD resume.md §1) 지원
    image: pgvector/pgvector:pg16
    container_name: kkori-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kkori
      POSTGRES_USER: kkori
      POSTGRES_PASSWORD: kkori
    volumes:
      - kkori-postgres-data:/var/lib/postgresql/data
      # 최초 볼륨 생성 시에만 실행 — pgvector 확장 활성화
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkori -d kkori"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kkori-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis 서버 메트릭을 Prometheus 형식으로 노출 (HBB1-341). 평소에는 안 뜨고 --profile monitoring 때만 기동.
  # 스크레이프 주소: compose 안에서는 redis-exporter:9121, 호스트에서는 localhost:9121
  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: kkori-redis-exporter
    profiles: [monitoring]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
      # 스트림 길이·컨슈머 그룹 pending/lag은 여기 적은 키만 수집 — Spring이 발행하는 3종(*RequestedMessage.STREAM_KEY)
      REDIS_EXPORTER_CHECK_STREAMS: resume.parse.requested,report.generation.requested,report.audio.analysis.requested
    ports:
      - "9121:9121"

  # S3 호환 저장소 — RustFS (MinIO 대체). MinIO 커뮤니티 에디션 종료로 이미지가 Docker Hub(2026-09-11)에 이어
  # quay.io에서도 사라져 MinIO 호환 S3 서버인 RustFS로 교체했다. TestcontainersConfiguration과 동일 이미지·자격증명.
  # 콘솔: http://localhost:9001/rustfs/console/ (kkori / kkori1234)
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: kkori-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      RUSTFS_ACCESS_KEY: kkori
      RUSTFS_SECRET_KEY: kkori1234
    volumes:
      - kkori-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 최초 기동 시 기본 버킷 생성 후 종료 (이미 있으면 통과)
  s3-init:
    image: amazon/aws-cli:2.37.6
    container_name: kkori-s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: kkori
      AWS_SECRET_ACCESS_KEY: kkori1234
      AWS_DEFAULT_REGION: ap-northeast-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket kkori-resumes 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket kkori-resumes

volumes:
  kkori-postgres-data:
  kkori-rustfs-data:
