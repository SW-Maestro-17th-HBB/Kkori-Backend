# 개발 서버(AWS) 환경 — 비밀값은 환경변수로 주입 (기본값 없음 = 미주입 시 기동 실패로 즉시 발견).
# S3: endpoint·credentials를 설정하지 않음 → SDK 기본 동작 (실제 S3 + IAM Role)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    aws:
      region:
        static: ap-northeast-2

app:
  s3:
    bucket: ${S3_BUCKET}
  # 동기/비동기 디스패치 실험 토글 (HBB1-327, docs/experiments/sync-dispatch.md).
  # 의도적 규칙 이탈: 이 환경 파일은 기본값 없는 ${ENV}가 원칙이지만, 실험 토글은
  # "미주입 = async(현행 동작)"이 안전한 기본이라 기본값을 준다. url·timeout은 sync일 때만 필수.
  ai-dispatch:
    mode: ${AI_DISPATCH_MODE:async}
    worker-base-url: ${AI_WORKER_BASE_URL:}
    sync-read-timeout: ${AI_DISPATCH_SYNC_READ_TIMEOUT:120s}

jwt:
  secret: ${JWT_SECRET}
  signup-secret: ${JWT_SIGNUP_SECRET}
  access-token-ttl: ${JWT_ACCESS_TTL}
  refresh-token-ttl: ${JWT_REFRESH_TTL}
  signup-token-ttl: ${JWT_SIGNUP_TTL}

account:
  withdrawal-grace-period: ${WITHDRAWAL_GRACE_PERIOD}

log-masking:
  hmac-key: ${LOG_HMAC_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  admin-key: ${KAKAO_ADMIN_KEY}
  app-id: ${KAKAO_APP_ID}

livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  token-ttl: ${LIVEKIT_TOKEN_TTL}
  api-timeout: ${LIVEKIT_API_TIMEOUT}
  recording:
    bucket: ${LIVEKIT_RECORDING_BUCKET}
    region: ${LIVEKIT_RECORDING_REGION}

session:
  end-fallback-timeout: ${SESSION_END_FALLBACK_TIMEOUT}
  agent-lost-grace: ${SESSION_AGENT_LOST_GRACE}
  stale-recovery-timeout: ${SESSION_STALE_RECOVERY_TIMEOUT}
  sweep-interval: ${SESSION_SWEEP_INTERVAL}
  reconnect-window: ${SESSION_RECONNECT_WINDOW}
