# 운영(AWS) 환경 — 비밀값은 환경변수로 주입 (기본값 없음 = 미주입 시 기동 실패로 즉시 발견).
# S3: endpoint·credentials를 설정하지 않음 → SDK 기본 동작 (실제 S3 + IAM Role)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    aws:
      region:
        static: ap-northeast-2

app:
  s3:
    bucket: ${S3_BUCKET}

jwt:
  secret: ${JWT_SECRET}
  signup-secret: ${JWT_SIGNUP_SECRET}
  access-token-ttl: ${JWT_ACCESS_TTL}
  refresh-token-ttl: ${JWT_REFRESH_TTL}
  signup-token-ttl: ${JWT_SIGNUP_TTL}

account:
  withdrawal-grace-period: ${WITHDRAWAL_GRACE_PERIOD}

log-masking:
  hmac-key: ${LOG_HMAC_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  admin-key: ${KAKAO_ADMIN_KEY}
  app-id: ${KAKAO_APP_ID}

# prod는 자체 호스팅 SFU로 전환 예정 — 전환 시 이 값들만 자체 SFU 주소·키로 교체
livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  token-ttl: ${LIVEKIT_TOKEN_TTL}
  api-timeout: ${LIVEKIT_API_TIMEOUT}
