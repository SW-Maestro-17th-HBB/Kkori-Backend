# 모든 환경 공통 설정. 환경별 설정은 application-{local,dev,prod}.yaml 참조.
spring:
  application:
    name: Kkori
  profiles:
    default: local   # 프로파일 미지정 시 local로 실행 (bootRun 바로 동작)
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

# JWT 기본값은 로컬 개발 전용.
jwt:
  secret: ${JWT_SECRET:kkori-local-dev-jwt-secret-key-must-be-32bytes}
  signup-secret: ${JWT_SIGNUP_SECRET:kkori-local-dev-signup-secret-key-32bytes!}
  access-token-ttl: ${JWT_ACCESS_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  signup-token-ttl: ${JWT_SIGNUP_TTL:10m}

# 계정 정책 — 탈퇴 후 파기 유예 기간
account:
  withdrawal-grace-period: ${WITHDRAWAL_GRACE_PERIOD:3d}

# 쉼표로 여러 오리진 허용 가능. 배포 시 프론트 도메인을 환경변수로 주입
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

kakao:
  client-id: ${KAKAO_CLIENT_ID:local-dev-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:local-dev-client-secret}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  # 연결 해제 웹훅 검증용. app-id(숫자 앱 ID)는 client-id(REST API 키)와 다른 값
  admin-key: ${KAKAO_ADMIN_KEY:local-dev-admin-key}
  app-id: ${KAKAO_APP_ID:local-dev-app-id}
