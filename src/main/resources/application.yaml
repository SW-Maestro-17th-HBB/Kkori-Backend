# 모든 환경 공통 설정. 환경별 설정은 application-{local,dev,prod}.yaml 참조.
spring:
  application:
    name: Kkori
  profiles:
    default: local   # 프로파일 미지정 시 local로 실행 (bootRun 바로 동작)
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

consent:
  versions:
    "[privacy]": 1
    "[audio_usage]": 1
    "[resume_usage]": 1
    "[marketing]": 1

kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

