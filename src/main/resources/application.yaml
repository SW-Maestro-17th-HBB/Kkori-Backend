# 모든 환경 공통 설정. 환경별 설정은 application-{local,dev,prod}.yaml 참조.
spring:
  application:
    name: Kkori
  profiles:
    default: local   # 프로파일 미지정 시 local로 실행 (bootRun 바로 동작)
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

server:
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat 스레드풀·커넥션 메트릭(tomcat_*) 노출용 — Boot 3 기본값 false (HBB1-328)

consent:
  versions:
    "[privacy]": 1
    "[audio_usage]": 1
    "[resume_usage]": 1
    "[marketing]": 1

kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

# 모니터링(HBB1-328) — actuator는 앱 포트(8080)와 분리한 8081에서만 응답한다.
# 8080은 ALB로 외부에 열려 있어 /actuator가 인터넷에 노출되지 않게 한다. 8081 개방은 인프라 보안 그룹이 담당.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus   # health=ALB 헬스체크, prometheus=메트릭 수집. 나머지는 비노출

