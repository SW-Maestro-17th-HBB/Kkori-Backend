spring:
  application:
    name: Kkori
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkori}
    username: ${DB_USERNAME:kkori}
    password: ${DB_PASSWORD:kkori}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
